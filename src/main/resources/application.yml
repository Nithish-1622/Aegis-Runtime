spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_runtime
    username: postgres
    password: nith@123
  jpa:
    hibernate:
      ddl-auto: validate    
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  anomaly:
    high-latency-threshold-ms: 500
    retry-amplification-threshold: 1.5
    thread-timeout-seconds: 60
    service-saturation-request-threshold: 1000
  kafka:
    bootstrap-servers: localhost:19092
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
      missing-topics-fatal: false
    consumer:
      group-id: runtime-intelligence-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            key:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            trusted:
              packages: "com.aegis.runtime.contracts"
