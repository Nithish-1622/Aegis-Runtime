spring:
  datasource:
    url: jdbc:h2:mem:aegis_runtime;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:19092
    listener:
      auto-startup: false
      missing-topics-fatal: false
    consumer:
      group-id: runtime-intelligence-test
